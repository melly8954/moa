# 환경변수는 이 파일에서만 읽는다 (harness-psw 5.3).
# 값이 필요한 설정은 @ConfigurationProperties + @Validated로 시작할 때 검증한다.
spring:
  application:
    name: moa
  profiles:
    default: local
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

psw:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:psw}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
    app-client-enabled: ${AUTH_APP_CLIENT_ENABLED:true}
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
