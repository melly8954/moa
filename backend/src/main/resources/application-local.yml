# 로컬 개발: compose.yaml의 MariaDB를 자동으로 띄우고 접속한다
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

  # 메일은 compose.yaml의 Mailpit이 받는다 (http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

psw:
  jwt:
    secret: ${JWT_SECRET:local-only-secret-change-me-0123456789abcdef}
  auth:
    refresh-cookie:
      secure: false
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
  # 개발용 키 재료와 자리표시. 실제 구글·카카오 인증은 .env의 키로 한다
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY:local-only-pii-encryption-key-change-me}
    hmac-key: ${PII_HMAC_KEY:local-only-pii-hmac-key-change-me}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
      client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}

logging:
  level:
    org.hibernate.SQL: debug
