# 로컬 개발: compose.yaml의 MariaDB를 자동으로 띄우고 접속한다
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

psw:
  jwt:
    secret: ${JWT_SECRET:local-only-secret-change-me-0123456789abcdef}
  auth:
    refresh-cookie:
      secure: false
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: debug
