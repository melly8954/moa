# 로컬 개발: compose.yaml의 MariaDB를 자동으로 띄우고 접속한다
spring:
  # backend/.env.local(KEY=값)을 읽는다. 없으면 건너뛴다. 터미널 환경 변수가 이 파일보다 우선한다
  config:
    import: optional:file:.env.local[.properties]
  flyway:
    # 로컬 개발 계정(admin, user)을 함께 넣는다
    locations: classpath:db/migration,classpath:db/localdata
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  jwt:
    # 기본값을 두지 않는다. backend/.env.local에 JWT_SECRET(32바이트 이상)을 넣는다 (backend/.env.example)
    secret: ${JWT_SECRET}
  auth:
    refresh-cookie:
      secure: false
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: debug
