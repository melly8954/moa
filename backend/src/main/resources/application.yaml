# 환경변수는 이 파일에서만 읽는다.
# 값이 필요한 설정은 @ConfigurationProperties + @Validated로 시작할 때 검증한다.
spring:
  application:
    name: moa
  # 기본 프로필이 없다. local, dev, prod 중 하나를 꼭 준다 (SPRING_PROFILES_ACTIVE). 없으면 시작 가드가 막는다
  # ./gradlew bootRun은 local로 띄운다 (build.gradle)
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:moa}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
    app-client-enabled: ${AUTH_APP_CLIENT_ENABLED:true}
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1} # 골격 마이그레이션이 만드는 시스템 계정
  # 첫 관리자. 둘 다 주고 띄우면 ADMIN이 하나도 없을 때만 만든다 (임시 비밀번호, 첫 로그인 때 바꾼다). 만든 뒤에는 지운다
  bootstrap-admin:
    login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:관리자}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
# 선택 헬퍼: login-history. apply.sh가 src/main/resources/application.yaml 끝에 문서로 덧붙인다
app:
  login-history:
    # 이 기간이 지난 접속 이력은 매일 새벽에 지운다. 90일은 specs/005-admin-login-history FR-002가 정한다
    retention-days: ${LOGIN_HISTORY_RETENTION_DAYS:90}
---
# 선택 헬퍼: rich-text. apply.sh가 src/main/resources/application.yaml 끝에 문서로 덧붙인다
app:
  rich-text:
    # 본문 이미지를 저장할 폴더. 운영은 백업되는 디스크로 준다
    image-dir: ${RICH_TEXT_IMAGE_DIR:./data/rich-text-images}
    # 본문 이미지 한 장의 최대 크기 (넘으면 V001)
    image-max-size: ${RICH_TEXT_IMAGE_MAX_SIZE:5MB}
    # 글에 쓰이지 않은(임시) 이미지를 이 시간이 지나면 지운다
    temp-retention: ${RICH_TEXT_TEMP_RETENTION:24h}
    cleanup-cron: ${RICH_TEXT_CLEANUP_CRON:0 50 4 * * *}
# 업로드 크기 상한. file 헬퍼와 같은 값을 쓴다 (둘 다 적용해도 같은 설정)
spring:
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}
---
# moa: 알림 (specs/007-notifications). 개인 알림 보관 기간과 브라우저 알림(웹 푸시) VAPID 키
app:
  notification:
    # 이 기간이 지난 개인 알림은 매일 지운다 (FR-009)
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 0 5 * * *}
  web-push:
    # VAPID 키(base64url). 비우면 브라우저 알림을 끈다. 키는 사람이 만들어 환경 변수로만 준다 (quickstart)
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    # 푸시 서버가 연락할 운영자 주소 (mailto:...)
    subject: ${WEB_PUSH_SUBJECT:}
