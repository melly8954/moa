# 환경변수는 이 파일에서만 읽는다.
# 값이 필요한 설정은 @ConfigurationProperties + @Validated로 시작할 때 검증한다.
spring:
  application:
    name: moa
  # 기본 프로필이 없다. local, dev, prod 중 하나를 꼭 준다 (SPRING_PROFILES_ACTIVE). 없으면 시작 가드가 막는다
  # ./gradlew bootRun은 local로 띄운다 (build.gradle)
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:moa}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
    app-client-enabled: ${AUTH_APP_CLIENT_ENABLED:true}
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1} # 골격 마이그레이션이 만드는 시스템 계정
  # 첫 관리자. 둘 다 주고 띄우면 ADMIN이 하나도 없을 때만 만든다 (임시 비밀번호, 첫 로그인 때 바꾼다). 만든 뒤에는 지운다
  bootstrap-admin:
    login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:관리자}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
# 선택 헬퍼: login-history. apply.sh가 src/main/resources/application.yaml 끝에 문서로 덧붙인다
app:
  login-history:
    # 이 기간이 지난 접속 이력은 매일 새벽에 지운다. 1년(365일)은 specs/005-admin-login-history FR-002가 정한다
    retention-days: ${LOGIN_HISTORY_RETENTION_DAYS:365}
---
# 선택 헬퍼: rich-text. apply.sh가 src/main/resources/application.yaml 끝에 문서로 덧붙인다
app:
  rich-text:
    # 본문 이미지를 저장할 폴더. 운영은 백업되는 디스크로 준다
    image-dir: ${RICH_TEXT_IMAGE_DIR:./data/rich-text-images}
    # 본문 이미지 한 장의 최대 크기 (넘으면 V001)
    image-max-size: ${RICH_TEXT_IMAGE_MAX_SIZE:5MB}
    # 글에 쓰이지 않은(임시) 이미지를 이 시간이 지나면 지운다
    temp-retention: ${RICH_TEXT_TEMP_RETENTION:24h}
    cleanup-cron: ${RICH_TEXT_CLEANUP_CRON:0 50 4 * * *}
# 업로드 크기 상한. file 헬퍼와 같은 값을 쓴다 (둘 다 적용해도 같은 설정)
spring:
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}
---
# moa: 알림 (specs/007-notifications). 개인 알림 보관 기간과 브라우저 알림(웹 푸시) VAPID 키
app:
  notification:
    # 이 기간이 지난 개인 알림은 매일 지운다 (FR-009)
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 0 5 * * *}
  web-push:
    # VAPID 키(base64url). 비우면 브라우저 알림을 끈다. 키는 사람이 만들어 환경 변수로만 준다 (quickstart)
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    # 푸시 서버가 연락할 운영자 주소 (mailto:...)
    subject: ${WEB_PUSH_SUBJECT:}
---
# moa: 개인정보 파기 이력 (specs/013-purge-log FR-006), 소셜 로그인 제공자 설정과 현재 약관 버전 (specs/010-social-login),
#   회원 탈퇴 (specs/018-member-withdrawal)
app:
  purge-log:
    # 이 기간이 지난 파기 이력은 매일 지운다. 다른 정리(04:30~05:00)가 끝난 뒤에 돈다
    retention-days: ${PURGE_LOG_RETENTION_DAYS:365}
    cleanup-cron: ${PURGE_LOG_CLEANUP_CRON:0 10 5 * * *}
  withdrawal:
    # 탈퇴한 뒤 복구할 수 있는 날수. 지나면 파기한다. docs/privacy.md의 30일과 맞춘다
    grace-days: ${WITHDRAWAL_GRACE_DAYS:30}
    # 파기 정리. 서버 시간대와 상관없이 cleanup-zone의 시각으로 돈다
    cleanup-cron: ${WITHDRAWAL_CLEANUP_CRON:0 20 5 * * *}
    cleanup-zone: ${WITHDRAWAL_CLEANUP_ZONE:Asia/Seoul}
  inquiry:
    # 탈퇴한 날부터 이 날수가 지난 회원의 1:1 문의를 지운다. docs/privacy.md의 1년과 맞춘다 (specs/017-customer-center FR-017)
    withdrawn-retention-days: ${INQUIRY_WITHDRAWN_RETENTION_DAYS:365}
    # 회원 파기(05:20) 뒤에 돈다
    cleanup-cron: ${INQUIRY_CLEANUP_CRON:0 30 5 * * *}
    cleanup-zone: ${INQUIRY_CLEANUP_ZONE:Asia/Seoul}
  oauth:
    google:
      # 셋 중 하나라도 비면 구글을 끈다 (단추 숨김, 시작·콜백 A008)
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
  terms:
    # 가입 때 동의받는 약관 버전. 비밀 값이 아니다 (잠정 draft, 배포 전 실제 버전으로)
    # 문안: 이용약관은 legal/terms/(아래 app.legal), 개인정보 수집·이용 동의는 frontend/src/content/terms/에 버전마다 둔다
    service-version: draft
    privacy-version: draft
  # moa: 공개 문서 문안 위치·오늘을 정하는 시간대 (specs/012-terms-privacy research R1·R5)
  # 위치 아래 terms/, privacy/에 버전마다 <버전>.json + <버전>.html. 문안이 잘못되면 시작하지 않는다
  legal:
    location: ${LEGAL_LOCATION:classpath:legal/}
    zone: ${LEGAL_ZONE:Asia/Seoul}
