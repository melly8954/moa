# 환경변수는 이 파일에서만 읽는다.
# 값이 필요한 설정은 @ConfigurationProperties + @Validated로 시작할 때 검증한다.
spring:
  application:
    name: moa
  # 기본 프로필이 없다. local, dev, prod 중 하나를 꼭 준다 (SPRING_PROFILES_ACTIVE). 없으면 시작 가드가 막는다
  # ./gradlew bootRun은 local로 띄운다 (build.gradle)
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:moa}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
    app-client-enabled: ${AUTH_APP_CLIENT_ENABLED:true}
  audit:
    system-actor-id: ${AUDIT_SYSTEM_ACTOR_ID:1} # 골격 마이그레이션이 만드는 시스템 계정
  # 첫 관리자. 둘 다 주고 띄우면 ADMIN이 하나도 없을 때만 만든다 (임시 비밀번호, 첫 로그인 때 바꾼다). 만든 뒤에는 지운다
  bootstrap-admin:
    login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:관리자}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
# 선택 헬퍼: login-history. apply.sh가 src/main/resources/application.yaml 끝에 문서로 덧붙인다
app:
  login-history:
    # 이 기간이 지난 접속 이력은 매일 새벽에 지운다
    retention-days: ${LOGIN_HISTORY_RETENTION_DAYS:365}
