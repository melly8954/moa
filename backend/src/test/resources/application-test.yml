spring:
  flyway:
    locations: classpath:db/migration,classpath:db/testmigration

psw:
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789
  audit:
    system-actor-id: 1
  # 테스트 전용 가짜 값. PiiCipher는 SHA-256으로 키를 만들므로 형식 제한이 없다
  pii:
    encryption-key: test-only-pii-encryption-key
    hmac-key: test-only-pii-hmac-key
  # OAuth는 StubOAuthClient가 대신한다. 값은 설정 검증만 통과하면 된다
  oauth:
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
