# 로컬 개발용. local 프로필로 실행하면 Spring Boot가 이 파일의 서비스를 띄우고 접속 정보를 잡는다
# 프로젝트 이름. 없으면 폴더 이름(backend)이 되어 다른 프로젝트의 컨테이너·DB와 섞인다. apply.sh가 --name으로 바꾼다
name: moa
# DB 데이터를 이름 붙인 볼륨(moa_mariadb-data)에 둔다. 컨테이너를 지우고 다시 만들어도(docker compose down) 데이터가 남는다
# 처음부터 다시 만들려면 docker compose down -v. 헬퍼 서비스가 파일 끝에 붙으므로 이 블록은 services 위에 둔다
volumes:
  mariadb-data:
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: moa
      MARIADB_USER: moa
      MARIADB_PASSWORD: moa
      MARIADB_ROOT_PASSWORD: moa
    # 호스트 포트를 고정해 DB 도구로 늘 같은 주소(localhost:3306)에 붙는다. 3306이 이미 쓰이면 앞 번호를 바꾼다
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
