plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.1.0'
	jjwtVersion = '0.12.6'
	springdocVersion = '2.8.9'
	archunitVersion = '1.4.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// DB
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// QueryDSL
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// JWT
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// API 문서
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// 로컬 실행 시 compose.yaml의 DB를 띄운다
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mariadb'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'file.encoding', 'UTF-8'
}

// 포맷: 네이버 코딩 컨벤션 포맷터. 커밋 전 ./gradlew spotlessApply
spotless {
	java {
		target 'src/*/java/**/*.java'
		lineEndings 'UNIX'
		eclipse().configFile('config/format/naver-eclipse-formatter.xml')
		importOrder('\\#', 'java', 'javax', 'org', 'net', 'com', '')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// lint: 네이버 코딩 컨벤션 규칙. 위반은 빌드를 막는다
checkstyle {
	toolVersion = '10.26.1'
	configFile = file('config/checkstyle/naver-checkstyle-rules.xml')
	configProperties = ['suppressionFile': file('config/checkstyle/naver-checkstyle-suppressions.xml')]
	maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
	// QueryDSL이 만든 Q클래스는 검사하지 않는다
	exclude '**/Q*.java'
	source = source.filter { !it.path.contains('generated') }
}

// 선택 헬퍼: 키트의 apply.sh가 gradle/helpers/에 넣은 설정을 불러온다
fileTree('gradle/helpers') { include '*.gradle' }.sort().each { apply from: it }
