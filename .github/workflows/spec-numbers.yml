# 스펙 번호 겹침 검사 (scripts/check-spec-numbers.sh, 규칙은 docs/spec-numbers.md)
#   PR: 병합 결과 기준으로 본다. 먼저 열린 PR이 상대보다 늦게 병합될 수 있어 dev push에서도 다시 본다
#       main에는 dev → main PR만 들어오고 그 PR 검사가 곧 병합 결과라 main push는 보지 않는다
#   paths 조건을 두지 않는다: 필수 검사로 걸면 조건에 안 맞는 PR에서 검사가 생기지 않아 병합이 막힌다. 몇 초면 끝난다
#   job 이름 spec-numbers는 ruleset 필수 검사 이름이다. 바꾸면 ruleset도 함께 고친다
# psw-dev-kit git 템플릿(--spec-kit)에서 온 파일이다. 여기서 고치지 않는다.
name: spec-numbers

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 앞선 실행을 취소한다. dev push는 병합마다 결과를 남기려고 취소하지 않는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-spec-numbers.sh
