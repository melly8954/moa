# 백엔드 기본 CI. 포맷(Spotless), lint(Checkstyle), 테스트(ArchUnit 등)와 DB 테스트(AC 테스트, Testcontainers)를 확인한다.
# 브랜치 흐름은 작업 브랜치 → dev → main이다 (docs/git.md). main·dev 푸시와 두 브랜치로 가는 PR에서 돈다. 작업 브랜치 푸시는 PR에서 확인한다.
#
# 키트 ci.yml을 backend/ 하위 폴더에 맞춰 루트로 옮겼다 (키트 README "CI").
name: backend-ci

on:
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers는 러너의 Docker를 쓴다
      - run: ./gradlew build dbTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # upload-artifact는 working-directory를 따르지 않는다
          path: |
            backend/build/reports/tests
            backend/build/reports/checkstyle
