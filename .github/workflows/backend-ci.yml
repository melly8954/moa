# 백엔드 기본 CI. 포맷(Spotless), lint(Checkstyle), 테스트(ArchUnit 등)와 DB 테스트(AC 테스트, Testcontainers)를 확인한다.
# 브랜치 흐름은 작업 브랜치 → dev → main이다 (docs/git.md). 작업 브랜치 푸시는 PR에서 확인한다.
#   build:   main·dev로 가는 PR과 dev 푸시에서 돈다 (포맷·lint·단위·아키텍처 테스트)
#            dev 푸시는 따로 통과한 PR들이 합쳐져 깨진 것을 병합 직후에 잡는다. main 푸시는 dev → main PR과 같은 내용이라 돌지 않는다
#   db-test: 작업 브랜치 → dev PR에서만 한 번 돈다. dev 푸시, dev → main PR은 같은 내용이라 건너뛴다
#            (frontend-ci의 e2e와 같은 규칙. 합친 뒤 깨지는 것은 대부분 build가 잡는다)
#
# 키트 ci.yml을 backend/ 하위 폴더에 맞춰 루트로 옮겼다 (키트 README "CI").
name: backend-ci

on:
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 앞선 실행을 취소한다. dev push는 병합마다 결과를 남기려고 취소하지 않는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          # upload-artifact는 working-directory를 따르지 않는다
          path: |
            backend/build/reports/tests
            backend/build/reports/checkstyle

  db-test:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers는 러너의 Docker를 쓴다
      - run: ./gradlew dbTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: db-test-reports
          path: backend/build/reports/tests
