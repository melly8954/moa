# 프론트 기본 CI. check는 전체 검사(포맷·lint·타입·색 검사·문구 검사·단위 테스트), e2e는 화면 검사(Playwright: 반응형·접근성)다.
# 브랜치 흐름은 작업 브랜치 → dev → main이다 (docs/git.md).
#   check: main·dev 푸시와 두 브랜치로 가는 PR에서 모두 돈다
#   e2e:   작업 브랜치 → dev PR에서만 한 번 돈다. dev 푸시, dev → main PR, main 푸시는 같은 내용이라 건너뛴다
#          합친 뒤의 결과는 e2e로 다시 보지 않는다 (합쳐서 깨지는 것은 대부분 check가 잡는다)
# e2e처럼 무거운 job을 더하면 같은 조건을 건다: if: github.base_ref == 'dev'
#
# 키트 ci.yml을 frontend/ 하위 폴더에 맞춰 루트로 옮겼다 (키트 README "CI").
name: frontend-ci

on:
  pull_request:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 빌드한 앱을 띄워 검사한다 (playwright.config.ts webServer). 백엔드는 띄우지 않는다
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # upload-artifact는 working-directory를 따르지 않는다
          path: frontend/playwright-report
