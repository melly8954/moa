# 스펙 번호 겹침 검사 (scripts/check-spec-numbers.sh, 규칙은 docs/spec-numbers.md)
#   PR: 병합 결과 기준으로 본다. 먼저 열린 PR이 상대보다 늦게 병합될 수 있어 dev·main push에서도 다시 본다
#   paths 조건을 두지 않는다: 필수 검사로 걸면 조건에 안 맞는 PR에서 검사가 생기지 않아 병합이 막힌다. 몇 초면 끝난다
# psw-dev-kit git 템플릿(--spec-kit)에서 온 파일이다. 여기서 고치지 않는다.
name: specs

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  spec-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-spec-numbers.sh
