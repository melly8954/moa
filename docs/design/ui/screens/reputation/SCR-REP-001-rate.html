      <div data-component="Alert" data-variant="destructive" data-slot="alert" role="alert" class="group/alert relative grid w-full gap-0.5 rounded-lg border px-2.5 py-2 text-left text-sm has-data-[slot=alert-action]:relative has-data-[slot=alert-action]:pr-18 has-[>svg]:grid-cols-[auto_1fr] has-[>svg]:gap-x-2 *:[svg]:row-span-2 *:[svg]:translate-y-0.5 *:[svg:not([class*='size-'])]:size-4 bg-card text-destructive *:data-[slot=alert-description]:text-destructive/90 *:[svg]:text-current">
        <div data-slot="alert-title" class="font-medium group-has-[>svg]/alert:col-start-2">평가 대상을 불러오지 못했습니다</div>
        <div data-slot="alert-description" class="text-sm text-balance text-muted-foreground md:text-pretty">잠시 후 다시 시도하세요.</div>
      </div>
      <button type="button" data-component="Button" data-variant="outline" data-slot="button" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 border-border bg-background hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">다시 시도</button>
    </section>
  </main>

  <script>
    // 목업 전용: 네 가지 상태와 다크 테마를 전환한다
    const bar = document.querySelector('.mock-bar');
    bar.querySelectorAll('[data-show]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mock-state]').forEach((s) => { s.hidden = s.dataset.mockState !== btn.dataset.show; });
        bar.querySelectorAll('[data-show]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
    const dark = bar.querySelector('[data-dark]');
    dark.addEventListener('click', () => {
      const on = document.documentElement.classList.toggle('dark');
      dark.setAttribute('aria-pressed', String(on));
    });
  </script>
</body>
</html>
