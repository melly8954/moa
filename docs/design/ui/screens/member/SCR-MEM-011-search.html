  <script>
    // 목업 전용: 네 가지 상태와 다크 테마를 전환한다
    const bar = document.querySelector('.mock-bar');
    bar.querySelectorAll('[data-show]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mock-state]').forEach((s) => { s.hidden = s.dataset.mockState !== btn.dataset.show; });
        bar.querySelectorAll('[data-show]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
    const dark = bar.querySelector('[data-dark]');
    dark.addEventListener('click', () => {
      const on = document.documentElement.classList.toggle('dark');
      dark.setAttribute('aria-pressed', String(on));
    });
  </script>
