    :root { color-scheme: light; --bg: #faf9f8; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #be123c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; }
    header nav { display: flex; flex-wrap: wrap; gap: 4px; }
    header nav a { padding: 4px 10px; border-radius: 999px; color: var(--fg); text-decoration: none; border: 1px solid var(--line); }
    header nav a:hover { border-color: var(--accent); color: var(--accent); }
    header input, header select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    main { padding: 16px; }
    h2 { font-size: 16px; margin: 24px 0 12px; } h2 small { color: var(--muted); font-weight: 400; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(var(--w, 300px), 1fr)); }
    .card { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .frame { position: relative; aspect-ratio: var(--ratio, 1280 / 900); overflow: hidden; background: #fff; border-bottom: 1px solid var(--line); }
    .frame iframe { position: absolute; top: 0; left: 0; width: var(--vw, 1280px); height: calc(var(--vw, 1280px) / var(--ratio-n, 1.4222)); border: 0; transform-origin: 0 0; pointer-events: none; }
    .cover { position: absolute; inset: 0; }
    figcaption { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; }
    figcaption a { color: var(--fg); font-weight: 600; text-decoration: none; } figcaption a:hover { color: var(--accent); }
    figcaption span { color: var(--muted); font-size: 12px; }
    .hidden { display: none; }
    /* 크게 보기: 카드를 누르면 페이지 안에서 연다. 주소 #view=<경로>라 뒤로가기도 목록으로 돌아온다 */
    #viewer { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #e7e5e4; }
    #viewer.open { display: flex; }
    #viewer .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
    #viewer .bar b { font-size: 15px; } #viewer .bar .refs { color: var(--muted); font-size: 12px; flex: 1; min-width: 120px; }
    #viewer button, #viewer a.btn, #viewer select { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; color: var(--fg); text-decoration: none; cursor: pointer; }
    #viewer button:hover, #viewer a.btn:hover { border-color: var(--accent); color: var(--accent); }
    #viewer button:disabled { opacity: .4; cursor: default; }
    #viewer .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
    #viewer .stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 16px; }
    #viewer .stage iframe { width: 100%; max-width: var(--stage-w, 100%); height: 100%; min-height: 600px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  </style>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="목업 크게 보기">
    <div class="bar">
      <button type="button" id="v-close">← 목록</button>
      <b id="v-title"></b><span class="refs" id="v-refs"></span>
      <button type="button" id="v-prev">‹ 이전</button><span class="pos" id="v-pos"></span><button type="button" id="v-next">다음 ›</button>
      <select id="v-width" aria-label="보기 폭"><option value="">창 폭</option><option value="768px">태블릿 768</option><option value="360px">모바일 360</option></select>
      <a class="btn" id="v-open" target="_blank">새 창</a>
    </div>
    <div class="stage"><iframe id="v-frame" title="목업"></iframe></div>
  </div>
  <script>
    // 크게 보기: ←/→ 이전·다음, Esc 목록. 검색으로 거른 카드만 넘긴다
    const viewer = document.getElementById("viewer"), frame = document.getElementById("v-frame")
    const visible = () => [...document.querySelectorAll(".card:not(.hidden)")]
    const srcOf = (c) => c.querySelector("figcaption a").getAttribute("href").slice(6)
    const show = () => {
      const m = location.hash.match(/^#view=(.+)$/)
      if (!m) { viewer.classList.remove("open"); frame.removeAttribute("src"); document.body.style.overflow = ""; return }
      const src = decodeURIComponent(m[1]), list = visible(), i = list.findIndex((c) => srcOf(c) === src)
      const card = list[i] || [...document.querySelectorAll(".card")].find((c) => srcOf(c) === src)
      document.getElementById("v-title").textContent = card ? card.querySelector("figcaption a").textContent : src
      document.getElementById("v-refs").textContent = card ? card.querySelector("figcaption span").textContent : ""
      document.getElementById("v-pos").textContent = i >= 0 ? (i + 1) + " / " + list.length : ""
      document.getElementById("v-prev").disabled = i <= 0
      document.getElementById("v-next").disabled = i < 0 || i >= list.length - 1
      document.getElementById("v-open").href = src
      if (frame.getAttribute("src") !== src) frame.src = src
      viewer.classList.add("open"); document.body.style.overflow = "hidden"
    }
    const go = (d) => { const list = visible(), m = location.hash.match(/^#view=(.+)$/); if (!m) return; const i = list.findIndex((c) => srcOf(c) === decodeURIComponent(m[1])); const n = list[i + d]; if (n) location.replace("#view=" + srcOf(n)) }
    // 닫으면 해시를 지우고 열기 전 스크롤 위치로 돌아간다. 브라우저 뒤로가기도 hashchange로 닫힌다
    let listY = 0
    document.addEventListener("click", (e) => { if (e.target.closest('main a[href^="#view="]')) listY = scrollY })
    const close = () => { history.replaceState(null, "", location.pathname); show(); scrollTo(0, listY) }
    document.getElementById("v-prev").onclick = () => go(-1)
    document.getElementById("v-next").onclick = () => go(1)
    document.getElementById("v-close").onclick = close
    document.getElementById("v-width").onchange = (e) => viewer.style.setProperty("--stage-w", e.target.value || "100%")
    addEventListener("keydown", (e) => {
      if (!viewer.classList.contains("open")) return
      if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); else if (e.key === "Escape") close()
    })
    addEventListener("hashchange", show); show()
  </script>
  <script>
    // 미리보기: 각 iframe을 고른 폭으로 그리고 카드 폭에 맞게 줄인다. 누르면 원본 목업을 새 창으로 연다
    const vp = document.getElementById("vp")
    const fit = () => {
      const w = Number(vp.value), h = w === 360 ? 740 : w === 768 ? 1000 : 900
      document.documentElement.style.setProperty("--vw", w + "px")
      document.documentElement.style.setProperty("--ratio", w + " / " + h)
      document.documentElement.style.setProperty("--ratio-n", String(w / h))
      document.documentElement.style.setProperty("--w", w === 360 ? "200px" : "300px")
      document.querySelectorAll(".frame").forEach((f) => { f.querySelector("iframe").style.transform = "scale(" + f.clientWidth / w + ")" })
    }
    vp.addEventListener("change", fit); addEventListener("resize", fit); fit()
    document.getElementById("q").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase()
      document.querySelectorAll(".card").forEach((c) => c.classList.toggle("hidden", q && !c.dataset.search.toLowerCase().includes(q)))
    })
  </script>
