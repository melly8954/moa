# harness-psw 프로젝트 설정. psw-design 구현 준비에서 채운다.
# install.sh는 이 파일을 덮어쓰지 않는다.

# 테스트 파일 경로 패턴 (bash glob, 공백으로 구분)
# 역할별 경로 검사(guard-paths.sh)가 쓴다. AC 테스트 도구에 맞춰 고친다.
# 패턴은 저장소 루트 기준 경로 전체와 비교한다. *는 /도 포함한다.
# 예: 백엔드 키트(Spring Boot)를 backend/에 두면 'backend/src/test/*'를 더한다.
PSW_TEST_GLOBS='tests/* test/* e2e/* __tests__/* */__tests__/* *.test.* *.spec.*'
