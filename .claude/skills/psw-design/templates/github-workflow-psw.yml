# harness-psw PR 검사 (5.4)
# GitHub를 쓰는 프로젝트에서 .github/workflows/psw.yml로 복사한다.
name: harness-psw

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 커밋 메시지
        run: |
          fail=0
          for c in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            bash .claude/scripts/psw/check-commit-msg.sh --commit "$c" || fail=1
          done
          exit $fail
